services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: career-compass-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=CareerCompass
      - API_V1_PREFIX=/api/v1
      - DATABASE_URL=sqlite+aiosqlite:///data/app.db
      - DEBUG=false
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
    container_name: career-compass-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-net

volumes:
  app_data:

networks:
  app-net:
    driver: bridge
