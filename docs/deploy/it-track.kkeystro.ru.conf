# it-track.kkeystro.ru — Career Compass (Кейс 3)

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name it-track.kkeystro.ru;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name it-track.kkeystro.ru;

    ssl_certificate /etc/letsencrypt/live/it-track.kkeystro.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/it-track.kkeystro.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/it-track.kkeystro.ru_access.log;
    error_log /var/log/nginx/it-track.kkeystro.ru_error.log;

    client_max_body_size 10M;

    # Frontend — статика
    location / {
        root /opt/it-track/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Backend API — прокси на uvicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
